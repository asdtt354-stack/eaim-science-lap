<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ⅶ. 태양계 - EAIM 과학 수업</title>
<style>
  :root { --main-color: #38bdf8; --bg-dark: #05060a; --accent: #a855f7; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg-dark); color: #fff; font-family: 'Pretendard', -apple-system, sans-serif; min-height: 100vh; }
  a { color: inherit; text-decoration: none; }
  .topbar { position: sticky; top: 0; z-index: 40; background: rgba(5,6,10,0.92); backdrop-filter: blur(10px); border-bottom: 1px solid #1c1e26; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .crumb { font-size: 0.78em; color: #888; } .crumb b { color: #ccc; font-weight: 600; }
  .hub-link { font-size: 0.72em; color: #aaa; padding: 6px 12px; border: 1px solid #2c2e3a; border-radius: 8px; }
  .hub-link:hover { border-color: var(--accent); color: #fff; }
  .hero { padding: 56px 20px 20px; text-align: center; max-width: 760px; margin: 0 auto; }
  .hero .eyebrow { font-size: 0.74em; font-weight: 800; letter-spacing: 2px; color: var(--accent); text-transform: uppercase; margin-bottom: 10px; }
  .hero h1 { font-size: clamp(1.9em, 4.5vw, 2.7em); margin: 0 0 14px; background: linear-gradient(100deg, #7dd3fc 20%, #fff 50%, #c4b5fd 100%); -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1.3; }
  .hero p.lead { color: #aaa; font-size: 0.98em; line-height: 1.75; margin: 0 auto; max-width: 580px; }
  .progress-shell { max-width: 620px; margin: 30px auto 0; padding: 16px 22px; background: #0d0e14; border: 1px solid #1c1e26; border-radius: 16px; }
  .progress-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .progress-top .p-label { font-size: 0.82em; color: #ccc; font-weight: 700; }
  .progress-top .p-count { font-size: 0.78em; color: #888; }
  .progress-bar-outer { height: 9px; border-radius: 5px; background: #1c1e26; overflow: hidden; }
  .progress-bar-inner { height: 100%; background: linear-gradient(90deg, #38bdf8, #a855f7); }
  .group-wrap { max-width: 900px; margin: 50px auto 0; padding: 0 20px; }
  .group-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 16px; }
  .group-head .g-num { font-size: 0.78em; font-weight: 900; color: var(--accent); background: rgba(168,85,247,0.14); padding: 3px 10px; border-radius: 7px; }
  .group-head h2 { margin: 0; font-size: 1.15em; }
  .lesson-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 42px; }
  @media (max-width: 640px) { .lesson-grid { grid-template-columns: 1fr; } }
  .lcard { display: flex; align-items: center; gap: 14px; background: #0d0e14; border: 1.5px solid #1c1e26; border-radius: 16px; padding: 16px 18px; transition: all .2s; }
  .lcard:hover { border-color: var(--main-color); transform: translateY(-2px); }
  .lcard .l-icon { font-size: 1.7em; flex-shrink: 0; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; background: #161821; border-radius: 12px; }
  .lcard .l-body { flex: 1; min-width: 0; }
  .lcard .l-page { font-size: 0.68em; color: #777; margin-bottom: 3px; }
  .lcard .l-title { font-size: 0.94em; font-weight: 800; color: #fff; margin-bottom: 3px; }
  .lcard .l-desc { font-size: 0.76em; color: #999; line-height: 1.5; }
  .lcard .l-badge { font-size: 0.66em; font-weight: 800; color: #34d399; background: rgba(52,211,153,0.14); padding: 3px 8px; border-radius: 6px; flex-shrink: 0; white-space: nowrap; }

  .related-wrap { max-width: 900px; margin: 0 auto 50px; padding: 0 20px; }
  .related-card { background: linear-gradient(135deg, rgba(56,189,248,0.10), rgba(168,85,247,0.10)); border: 1px solid rgba(56,189,248,0.25); border-radius: 18px; padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .related-card .txt strong { display: block; margin-bottom: 4px; } .related-card .txt span { font-size: 0.82em; color: #aaa; }
  .related-card .links { display: flex; gap: 8px; flex-wrap: wrap; }
  .related-card a.go { background: var(--main-color); color: #04202b; font-weight: 800; padding: 10px 16px; border-radius: 9px; font-size: 0.82em; white-space: nowrap; }

  footer { text-align: center; padding: 10px 20px 50px; color: #555; font-size: 0.75em; }
</style>
<style>/* 공통규칙 3번: 한글 줄바꿈 — 단어 중간에서 끊지 않기 */ body{word-break:keep-all;overflow-wrap:break-word;}</style>
</head>
<body>

  <div class="topbar">
    <div class="crumb"><b>과학1</b><span class="sep">/</span><b>Ⅶ. 태양계</b></div>
    <a class="hub-link" href="index.html">← 과학1 전체 단원</a>
  </div>

  <section class="hero">
    <div class="eyebrow">과학1 · Ⅶ단원</div>
    <h1>태양계</h1>
    <p class="lead">태양계에는 무엇이 있을까? 지구는 왜 돌고, 달은 왜 모양이 바뀔까? 태양-지구-달의 관계로 우주의 규칙을 살펴보는 단원이다.</p>
  </section>

  <div class="progress-shell">
    <div class="progress-top"><span class="p-label">단원 진행률</span><span class="p-count">7 / 7 완료</span></div>
    <div class="progress-bar-outer"><div class="progress-bar-inner" style="width:100%"></div></div>
  </div>

  <div class="group-wrap">
    <div class="group-head"><span class="g-num">1</span><h2>태양계 구성 천체와 태양의 활동</h2></div>
    <div class="lesson-grid" id="group1"></div>

    <div class="group-head"><span class="g-num">2</span><h2>지구와 달의 운동</h2></div>
    <div class="lesson-grid" id="group2"></div>
  </div>

  <div class="related-wrap">
    <div class="related-card">
      <div class="txt"><strong>더 깊이 탐험해 보고 싶다면?</strong><span>기존 태양계·천문대 앱에서 직접 조작해 볼 수 있다.</span></div>
      <div class="links">
        <a class="go" href="../space.html">3D 태양계 →</a>
        <a class="go" href="../observatory.html">천문대 관측 →</a>
      </div>
    </div>
  </div>

  <footer>EAIM 과학 수업 · 과학1 · 전체 7개 대단원 완료 🎉</footer>

<script>
const GROUP1 = [
  { icon:'☀️', title:'태양계 구성 천체', desc:'태양~해왕성, 혜성 카드 갤러리', href:'unit7/solar-system-bodies.html', done:true },
  { icon:'🪐', title:'태양계 행성 분류', desc:'내행성/외행성, 지구형/목성형 분류', href:'unit7/planet-classification.html', done:true },
  { icon:'⚫', title:'태양의 활동', desc:'흑점·홍염·플레어·태양풍 카드', href:'unit7/solar-activity.html', done:true },
];
const GROUP2 = [
  { icon:'🔄', title:'지구의 자전과 천체의 겉보기 운동', desc:'시간 슬라이더로 보는 일주 운동', href:'unit7/earth-rotation.html', done:true },
  { icon:'🌌', title:'지구의 공전과 별자리 변화', desc:'월별 밤하늘 별자리 시뮬레이션', href:'unit7/earth-revolution.html', done:true },
  { icon:'🌗', title:'달의 위상 변화', desc:'공전 위치에 따른 실제 달 모양 계산', href:'unit7/moon-phases.html', done:true },
  { icon:'🌘', title:'일식과 월식', desc:'태양-지구-달 배치 비교 탭', href:'unit7/eclipses.html', done:true },
];

function renderGroup(id, items){
  document.getElementById(id).innerHTML = items.map(item => `
    <a class="lcard" href="${item.href}">
      <div class="l-icon">${item.icon}</div>
      <div class="l-body">
                <div class="l-title">${item.title}</div>
        <div class="l-desc">${item.desc}</div>
      </div>
      <div class="l-badge">${item.done ? '완료' : '준비중'}</div>
    </a>
  `).join('');
}
renderGroup('group1', GROUP1);
renderGroup('group2', GROUP2);
</script>
</body>
</html>
