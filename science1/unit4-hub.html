<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ⅳ. 물질의 상태 변화 - EAIM 과학 수업</title>
<style>
  :root { --main-color: #f43f5e; --bg-dark: #0a0708; --accent: #a855f7; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg-dark); color: #fff; font-family: 'Pretendard', -apple-system, sans-serif; min-height: 100vh; }
  a { color: inherit; text-decoration: none; }

  .topbar { position: sticky; top: 0; z-index: 40; background: rgba(10,7,8,0.92); backdrop-filter: blur(10px); border-bottom: 1px solid #262022; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .crumb { font-size: 0.78em; color: #888; }
  .crumb b { color: #ccc; font-weight: 600; }
  .crumb .sep { margin: 0 6px; color: #444; }
  .hub-link { font-size: 0.72em; color: #aaa; padding: 6px 12px; border: 1px solid #3a3a3c; border-radius: 8px; }
  .hub-link:hover { border-color: var(--accent); color: #fff; }

  .hero { padding: 56px 20px 20px; text-align: center; max-width: 760px; margin: 0 auto; }
  .hero .eyebrow { font-size: 0.74em; font-weight: 800; letter-spacing: 2px; color: var(--accent); text-transform: uppercase; margin-bottom: 10px; }
  .hero h1 { font-size: clamp(1.9em, 4.5vw, 2.7em); margin: 0 0 14px; background: linear-gradient(100deg, #94a3b8 20%, #fff 50%, #fb923c 100%); -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1.3; }
  .hero p.lead { color: #aaa; font-size: 0.98em; line-height: 1.75; margin: 0 auto; max-width: 580px; }

  .progress-shell { max-width: 620px; margin: 30px auto 0; padding: 16px 22px; background: #121012; border: 1px solid #262022; border-radius: 16px; }
  .progress-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .progress-top .p-label { font-size: 0.82em; color: #ccc; font-weight: 700; }
  .progress-top .p-count { font-size: 0.78em; color: #888; }
  .progress-bar-outer { height: 9px; border-radius: 5px; background: #262022; overflow: hidden; }
  .progress-bar-inner { height: 100%; background: linear-gradient(90deg, #94a3b8, #fb923c); }

  .group-wrap { max-width: 900px; margin: 50px auto 0; padding: 0 20px; }
  .group-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 16px; }
  .group-head .g-num { font-size: 0.78em; font-weight: 900; color: var(--accent); background: rgba(168,85,247,0.14); padding: 3px 10px; border-radius: 7px; }
  .group-head h2 { margin: 0; font-size: 1.15em; }

  .lesson-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 42px; }
  @media (max-width: 640px) { .lesson-grid { grid-template-columns: 1fr; } }

  .lcard { display: flex; align-items: center; gap: 14px; background: #121012; border: 1.5px solid #262022; border-radius: 16px; padding: 16px 18px; transition: all .2s; }
  .lcard:hover { border-color: var(--main-color); transform: translateY(-2px); }
  .lcard .l-icon { font-size: 1.7em; flex-shrink: 0; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; background: #1a1a1c; border-radius: 12px; }
  .lcard .l-body { flex: 1; min-width: 0; }
  .lcard .l-page { font-size: 0.68em; color: #777; margin-bottom: 3px; }
  .lcard .l-title { font-size: 0.94em; font-weight: 800; color: #fff; margin-bottom: 3px; }
  .lcard .l-desc { font-size: 0.76em; color: #999; line-height: 1.5; }
  .lcard .l-badge { font-size: 0.66em; font-weight: 800; color: #34d399; background: rgba(52,211,153,0.14); padding: 3px 8px; border-radius: 6px; flex-shrink: 0; white-space: nowrap; }

  footer { text-align: center; padding: 10px 20px 50px; color: #555; font-size: 0.75em; }
</style>
<style>/* 공통규칙 3번: 한글 줄바꿈 — 단어 중간에서 끊지 않기 */ body{word-break:keep-all;overflow-wrap:break-word;}</style>
</head>
<body>

  <div class="topbar">
    <div class="crumb"><b>과학1</b><span class="sep">/</span><b>Ⅳ. 물질의 상태 변화</b></div>
    <a class="hub-link" href="index.html">← 과학1 전체 단원</a>
  </div>

  <section class="hero">
    <div class="eyebrow">과학1 · Ⅳ단원</div>
    <h1>물질의 상태 변화</h1>
    <p class="lead">고체, 액체, 기체는 서로 어떻게 오갈까? 상태가 변할 때 입자에게, 그리고 열에너지에게 무슨 일이 일어나는지 살펴보는 단원이다.</p>
  </section>

  <div class="progress-shell">
    <div class="progress-top"><span class="p-label">단원 진행률</span><span class="p-count" id="pCount">7 / 7 완료</span></div>
    <div class="progress-bar-outer"><div class="progress-bar-inner" id="pBar" style="width:100%"></div></div>
  </div>

  <div class="group-wrap">
    <div class="group-head"><span class="g-num">1</span><h2>입자의 운동과 물질의 상태</h2></div>
    <div class="lesson-grid" id="group1"></div>

    <div class="group-head"><span class="g-num">2</span><h2>상태 변화와 열에너지</h2></div>
    <div class="lesson-grid" id="group2"></div>
  </div>

  <footer>EAIM 과학 수업 · 과학1</footer>

<script>
const GROUP1 = [
  { icon:'🌸', title:'입자의 운동', desc:'확산·증발 시뮬레이션', href:'unit4/particle-motion.html', done:true },
  { icon:'🧊', title:'물질의 상태', desc:'고체·액체·기체 입자 배열 + 그릇 모양 실험', href:'unit4/matter-states.html', done:true },
  { icon:'🔺', title:'물질의 상태 변화', desc:'융해·응고·기화·액화·승화 다이어그램', href:'unit4/state-change-types.html', done:true },
  { icon:'⚖️', title:'상태 변화와 입자 배열의 변화', desc:'질량 vs 부피 비교 슬라이더', href:'unit4/particle-arrangement-change.html', done:true },
];
const GROUP2 = [
  { icon:'📈', title:'열에너지를 흡수하는 상태 변화', desc:'가열 온도-시간 그래프 시뮬레이션', href:'unit4/heating-graph-absorb.html', done:true },
  { icon:'📉', title:'열에너지를 방출하는 상태 변화', desc:'냉각 온도-시간 그래프 시뮬레이션', href:'unit4/cooling-graph-release.html', done:true },
  { icon:'🧣', title:'상태 변화와 열에너지의 이용', desc:'실생활 흡열·발열 활용 사례 카드', href:'unit4/state-change-applications.html', done:true },
];

function renderGroup(id, items){
  document.getElementById(id).innerHTML = items.map(item => `
    <a class="lcard" href="${item.href}">
      <div class="l-icon">${item.icon}</div>
      <div class="l-body">
                <div class="l-title">${item.title}</div>
        <div class="l-desc">${item.desc}</div>
      </div>
      <div class="l-badge">${item.done ? '완료' : '준비중'}</div>
    </a>
  `).join('');
}
renderGroup('group1', GROUP1);
renderGroup('group2', GROUP2);
</script>
</body>
</html>
